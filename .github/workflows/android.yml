name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Si se suben varios cambios seguidos, solo se publica el último (evita que una
# compilación antigua pise a la nueva en «android-latest»).
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (ver README, sección App Android)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/controltorbox.keystore"

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/controltorbox.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk ../Controltorbox.apk
          # La app consulta este archivo una vez al día para saber si hay versión nueva.
          printf '{"versionCode": %s, "versionName": "%s", "apk": "Controltorbox.apk"}\n' "$VERSION_CODE" "$VERSION_NAME" > ../version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Controltorbox-apk
          path: |
            Controltorbox.apk
            version.json

      - name: Publicar en «Releases»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Controltorbox.apk version.json \
            --title "App Android (última versión)" \
            --notes "Versión 1.0.${{ github.run_number }} compilada a partir de ${{ github.sha }}. Descarga Controltorbox.apk desde el móvil e instálalo." \
            --target "${{ github.sha }}"
